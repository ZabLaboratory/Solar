name: Release

# Restores the Solar release pipeline removed in #26 (commit 7fd68de), where
# Solar was switched to manual VPS hot-pushes. That left no versioned source of
# truth for the dist/ artefacts that Orion's static-serve and Prism's vendoring
# both consume — a fresh box could not be rebuilt. This re-creates the
# MECHANISM: a semver tag push builds dist/ and publishes the versioned tarball
# as a GitHub Release asset.
#
# Asset contract (DO NOT CHANGE without updating Orion deploy.yml): the asset is
# named `solar-<tag>.tgz` and is `dist/` packed flat (`tar -C dist .`). Orion's
# deploy.yml downloads it anonymously from
#   releases/download/<tag>/solar-<tag>.tgz
# and extracts it into $APP_PATH/solar/<tag>. Solar is a PUBLIC repo so the
# download needs no token.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish bundle tarball
    # The release uses the configured vps-ovh self-hosted runner pool.
    runs-on: [self-hosted, vps-ovh]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:architecture
      - run: npm run test:architecture
      - run: npm run check:native-client
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      # Both binaries came from the same successful LSDP-native CI commit.
      # The public staging release is immutable input; digest drift fails closed.
      - name: Fetch and package pinned native receiver binaries
        run: |
          set -eu
          native_tag=native-lsdp-24c0517
          native_revision=24c051785a178f5b514b9d2e21a6c44ba6c978d1
          mkdir -p native-input
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/ZabLaboratory/Solar/releases/download/$native_tag/lsdpd-win32-x64.exe" \
            -o native-input/lsdpd-win32-x64.exe
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/ZabLaboratory/Solar/releases/download/$native_tag/lsdpd-linux-x64" \
            -o native-input/lsdpd-linux-x64
          printf '%s  %s\n' \
            '89d6885f21c123a12a5d51a9177ace039ef92b4f8ef002d57e32c5b5ef3f3676' native-input/lsdpd-win32-x64.exe \
            'a6c76fdf699a908dedc937e2a34026876ef8352cbeeb1087b4dcb7f8a365204e' native-input/lsdpd-linux-x64 \
            | sha256sum --check
          npm run package:native -- --binary native-input/lsdpd-win32-x64.exe --platform win32-x64 --revision "$native_revision"
          npm run package:native -- --binary native-input/lsdpd-linux-x64 --platform linux-x64 --revision "$native_revision"
          npm run check:native-package -- win32-x64 linux-x64

      - name: Resolve version from tag
        id: version
        # refs/tags/v1.2.3 or the release-proof v1.2.3b → value=1.2.3
        run: |
          value="$(printf '%s' "$GITHUB_REF_NAME" | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          test "$value" != "$GITHUB_REF_NAME"
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Verify package.json version matches tag
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$pkg_version" != "${{ steps.version.outputs.value }}" ]; then
            echo "::error::package.json version ($pkg_version) does not match tag (${{ steps.version.outputs.value }})"
            exit 1
          fi

      - name: Pack dist as solar-vX.Y.Z.tgz
        # Versioned tarball consumed by Orion v2 static-serve and Prism
        # vendoring via gh release. Flat pack of dist/ (asset-name + layout
        # are a contract with Orion deploy.yml — see header).
        run: |
          mkdir -p release
          npm run check:layout
          tar -czf "release/solar-${GITHUB_REF_NAME}.tgz" -C dist .
          node scripts/create-runtime-manifest.mjs \
            "release/solar-${GITHUB_REF_NAME}.tgz" \
            "${{ steps.version.outputs.value }}" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_REF_NAME" \
            "release/solar-runtime-manifest.json"
          ls -la release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/solar-*.tgz
            release/solar-runtime-manifest.json
